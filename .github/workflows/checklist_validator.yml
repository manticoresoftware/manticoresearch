name: 📝 Checklist Validator
run-name: 📝 Checklist Validator for issue ${{ github.event.issue.number }}

on:
  issues:
    types:
      - closed

permissions:
  contents: read
  # Reopens the issue and comments when the checklist is incomplete.
  issues: write

jobs:
  checklist-validation:
    name: ✅ Checklist Completion Check
    runs-on: ubuntu-22.04
    steps:
      - uses: manticoresoftware/manticoresearch/actions/checklist-validator@main
    