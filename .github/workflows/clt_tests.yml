name: CLT tests 
on:
  workflow_call:
    inputs:
      docker_image:
        required: true
        type: string
        description: "Docker image to use for tests"
      artifact_name:
        required: false
        type: string
        description: "Name of the docker image artifact"
      repository:
        required: false
        type: string
        description: "Repository to checkout"
      ref:
        required: false
        type: string
        description: "Ref to checkout"
      continue_on_error:
        required: false
        type: boolean
        description: "Continue on error"
        default: false
    secrets:
      OPENAI_API_KEY:
        required: true
        description: "OpenAI API key for CLT tests"
      VOYAGE_API_KEY:
        required: true
        description: "Voyage API key for CLT tests"
      JINA_API_KEY:
        required: true
        description: "Jina API key for CLT tests"

jobs:
  discover:
    name: Discover CLT tests
    runs-on: ubuntu-22.04
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    outputs:
      matrix: ${{ steps.balance.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      - id: build
        name: Build matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib

          openai_key = os.environ.get("OPENAI_API_KEY", "")
          voyage_key = os.environ.get("VOYAGE_API_KEY", "")
          jina_key = os.environ.get("JINA_API_KEY", "")
          have_remote_embedding_keys = all([openai_key, voyage_key, jina_key])

          roots = [
              "test/clt-tests/buddy",
              "test/clt-tests/buddy-plugins",
              "test/clt-tests/bugs",
              "test/clt-tests/core",
              "test/clt-tests/data-manipulation",
              "test/clt-tests/expected-errors",
              "test/clt-tests/fulltext-search",
              "test/clt-tests/mcl",
              "test/clt-tests/http-interface",
              "test/clt-tests/indexer",
              "test/clt-tests/join",
              "test/clt-tests/kibana",
              "test/clt-tests/mysqldump/mysql",
              "test/clt-tests/mysqldump/maria",
              "test/clt-tests/performance",
              "test/clt-tests/replication",
              "test/clt-tests/sharding/cluster",
              "test/clt-tests/sharding/functional",
              "test/clt-tests/sharding/replication",
              "test/clt-tests/sharding/syntax",
              "test/clt-tests/sharding/rollback",
              "test/clt-tests/sharding/regression",
              "test/clt-tests/sharding/table",
              "test/clt-tests/sharding/drop",
              "test/clt-tests/test-configuration",
              "test/clt-tests/vector-knn",
          ]

          tests = []
          for root in roots:
              root_path = pathlib.Path(root)
              if not root_path.exists():
                  continue
              for path in sorted(root_path.glob("*.rec")):
                  content = path.read_text(encoding="utf-8")
                  if not have_remote_embedding_keys and "api_key='" in content.lower():
                      continue
                  # clt appends "*.rec" to the prefix; strip the suffix to avoid ".rec*.rec"
                  tests.append(str(path.with_suffix("")))

          print(f"Found {len(tests)} .rec tests")
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as fh:
              fh.write("tests<<EOF\n")
              fh.write("\n".join(tests))
              fh.write("\nEOF\n")
          PY

      - id: balance
        name: Balance CLT tests
        uses: manticoresoftware/clt/balance/plan@main
        with:
          tests: ${{ steps.build.outputs.tests }}
          workers: 20

  clt:
    name: CLT
    needs: [discover]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: ${{ inputs.continue_on_error }}
    env:
      CLT_TIMINGS_PERSIST: 'false'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      # Restore an opaque shared cache snapshot. The fan-in job merges subtrees changed by
      # all legs and saves the next immutable cache generation after this matrix completes.
      # NOTE: this makes .cache a mountpoint, so tests must never `rm -rf /var/lib/manticore`
      # itself — wipe its contents instead (`rm -rf /var/lib/manticore/*` leaves .cache alone).
      - id: model_cache
        name: Restore model cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/clt-model-cache
          key: clt-models-v2-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clt-models-v2-linux-amd64-

      - name: Ensure model cache dir
        shell: bash
        run: mkdir -p "${{ runner.temp }}/clt-model-cache" && chmod 777 "${{ runner.temp }}/clt-model-cache"

      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Snapshot model cache before CLT
        shell: bash
        run: |
          python3 .github/scripts/stage-clt-model-cache-delta.py snapshot \
            --cache-dir "${{ runner.temp }}/clt-model-cache" \
            --manifest "${{ runner.temp }}/clt-model-cache-before.tsv"

      - id: run-clt
        uses: manticoresoftware/clt@main
        with:
          artifact: ${{ inputs.artifact_name }}
          image: ${{ inputs.docker_image }}
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          tests: ${{ toJSON(matrix.chunk.tests) }}
          comment_mode: failures
          run_args: "-e OPENAI_API_KEY -e VOYAGE_API_KEY -e JINA_API_KEY -v ${{ runner.temp }}/clt-model-cache:/var/lib/manticore/.cache"
          ui_host: "https://clt.manticoresearch.com"

      # Containers write model blobs as root with mode 600; make them readable so the
      # runner user can upload changed cache subtrees.
      - name: Fix model cache permissions
        if: ${{ always() }}
        shell: bash
        run: sudo chmod -R a+rX "${{ runner.temp }}/clt-model-cache" || true

      - id: model_cache_delta
        name: Stage changed model-cache folders
        if: ${{ always() }}
        shell: bash
        run: |
          python3 .github/scripts/stage-clt-model-cache-delta.py stage \
            --cache-dir "${{ runner.temp }}/clt-model-cache" \
            --manifest "${{ runner.temp }}/clt-model-cache-before.tsv" \
            --destination "${{ runner.temp }}/clt-model-cache-delta"

      # Every leg uploads an artifact, including an empty marker. This lets the fan-in job
      # run without special handling for a matrix where no model cache changed.
      - name: Upload changed model-cache folders
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: clt-model-cache-${{ matrix.chunk.id }}
          path: ${{ runner.temp }}/clt-model-cache-delta
          retention-days: 1

      - name: Stage timing measurements
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/clt-timing-artifact"
          if [[ -f "${{ runner.temp }}/clt-model-cache/.clt-model-cache-ready" ]] && [[ "${{ steps.model_cache_delta.outputs.changed }}" != "true" ]] && [[ -f "${{ steps.run-clt.outputs.timing-results }}" ]]; then
            cp "${{ steps.run-clt.outputs.timing-results }}" "${{ runner.temp }}/clt-timing-artifact/${{ matrix.chunk.id }}.tsv"
          else
            : > "${{ runner.temp }}/clt-timing-artifact/${{ matrix.chunk.id }}.tsv"
          fi

      - name: Upload timing measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: clt-timings-${{ matrix.chunk.id }}
          path: ${{ runner.temp }}/clt-timing-artifact/${{ matrix.chunk.id }}.tsv
          retention-days: 1

  persist-clt-caches:
    name: Persist CLT caches
    needs: [clt]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - id: model_cache
        name: Restore shared model cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/clt-model-cache
          key: clt-models-v2-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            clt-models-v2-linux-amd64-

      - id: baseline
        name: Check shared model cache state
        shell: bash
        run: |
          if [[ -f "${{ runner.temp }}/clt-model-cache/.clt-model-cache-ready" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download changed model-cache folders
        uses: actions/download-artifact@v7
        with:
          pattern: clt-model-cache-*
          path: ${{ runner.temp }}/clt-model-cache-artifacts
          merge-multiple: true

      - id: merge
        name: Merge model-cache folders
        shell: bash
        run: |
          set -euo pipefail
          baseline="${{ runner.temp }}/clt-model-cache"
          artifacts="${{ runner.temp }}/clt-model-cache-artifacts"

          find "$artifacts" -maxdepth 1 -name .clt-artifact-empty-marker -type f -delete
          changed=false
          if find "$artifacts" -mindepth 1 -print -quit | grep -q .; then
            rsync -a --ignore-existing "$artifacts/" "$baseline/"
            changed=true
          fi

          touch "$baseline/.clt-model-cache-ready"
          printf 'Merged %s model-cache files\n' "$(find "$baseline" -type f | wc -l | tr -d ' ')"
          printf 'changed=%s\n' "$changed" >> "$GITHUB_OUTPUT"

      - name: Save shared model cache
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (steps.merge.outputs.changed == 'true' || steps.baseline.outputs.ready != 'true') }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/clt-model-cache
          key: clt-models-v2-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist CLT timing cache
        uses: manticoresoftware/clt/balance/merge-results@main
