name: Nightly integration tests
run-name: 🌙 Nightly integration tests ${{ github.sha }}

on:
  schedule:
    - cron: '00 20 * * *'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'test/clt-tests/integrations/**'
      - '.github/workflows/nightly_integrations.yml'

concurrency:
  group: nightly_integrations_${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit_info:
    name: Commit info
    runs-on: ubuntu-22.04
    steps:
      - run: |
          echo "# Nightly integration tests" >> $GITHUB_STEP_SUMMARY
          echo "* Attempt: ${{ github.run_attempt }}" >> $GITHUB_STEP_SUMMARY

  resolve_bulk_import_image:
    name: Resolve bulk import test-kit image
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Resolve image
        id: resolve
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "image=ghcr.io/${REPO_OWNER}/manticoresearch:test-kit-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch_tag=$(echo "$HEAD_REF" | tr '/' '_' | sed 's/[^a-zA-Z0-9_.-]//g')
          image="ghcr.io/${REPO_OWNER}/manticoresearch:test-kit-${branch_tag}"
          for attempt in $(seq 1 480); do
            image_commit=$(docker buildx imagetools inspect "$image" --format '{{ index .Image.Config.Labels "org.manticore.testkit.commit" }}' 2>/dev/null || true)
            if [[ "$image_commit" == "${{ github.sha }}" ]]; then
              echo "image=$image" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for $image at ${{ github.sha }} (currently ${image_commit:-missing}, attempt $attempt/480)"
            sleep 15
          done
          echo "Timed out waiting for $image at ${{ github.sha }}" >&2
          exit 1

  # ==========================================
  # Version Check Jobs
  # ==========================================
  check_filebeat_versions:
    name: Check Filebeat versions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: manticoresoftware/clt@0.7.9
        with:
          test_prefix: test/clt-tests/integrations/filebeat/test-integrations-check-filebeat-versions
          image: ghcr.io/manticoresoftware/manticoresearch:test-kit-latest
          comment_mode: failures
          run_args: --privileged -v $(pwd)/manual:/manual
          ui_host: "https://clt.manticoresearch.com"

  check_logstash_versions:
    name: Check Logstash versions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: manticoresoftware/clt@0.7.9
        with:
          test_prefix: test/clt-tests/integrations/logstash/test-integrations-check-logstash-versions
          image: ghcr.io/manticoresoftware/manticoresearch:test-kit-latest
          comment_mode: failures
          run_args: --privileged -v $(pwd)/manual:/manual
          ui_host: "https://clt.manticoresearch.com"

  check_grafana_versions:
    name: Check Grafana versions
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: manticoresoftware/clt@0.7.9
        with:
          test_prefix: test/clt-tests/integrations/grafana/test-integrations-check-grafana-versions
          image: ghcr.io/manticoresoftware/manticoresearch:test-kit-latest
          comment_mode: failures
          run_args: --privileged -v $(pwd)/manual:/manual
          ui_host: "https://clt.manticoresearch.com"

  # ==========================================
  # Integration Test Jobs
  # ==========================================
  test_dbeaver:
    name: Test DBeaver integration
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: manticoresoftware/clt@0.7.9
        with:
          test_prefix: test/clt-tests/integrations/dbeaver/test-integrations-dbeaver
          image: ghcr.io/manticoresoftware/manticoresearch:test-kit-latest
          comment_mode: failures
          run_args: --privileged
          ui_host: "https://clt.manticoresearch.com"

  test_filebeat:
    name: Test Filebeat integration
    needs: resolve_bulk_import_image
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: manticoresoftware/clt@0.7.9
        with:
          test_prefix: test/clt-tests/integrations/filebeat/test-integrations-filebeat
          image: ${{ needs.resolve_bulk_import_image.outputs.image }}
